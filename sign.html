<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Document · Demo</title>
<style>
  *{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",sans-serif;background:#eef2f7;color:#1f2937}
  .top{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 24px;font-weight:700;color:#2563eb}
  main{max-width:760px;margin:30px auto;padding:0 16px}
  .doc{background:#fff;border-radius:10px;box-shadow:0 10px 30px -12px rgba(0,0,0,.2);padding:40px;min-height:380px}
  .doc h1{font-size:22px;margin:0 0 18px}.doc p{color:#4b5563;line-height:1.6}
  .sig{margin-top:40px;border-bottom:2px solid #9ca3af;width:280px;height:60px;font:italic 32px "Brush Script MT",cursive;color:#1e3a8a;display:flex;align-items:flex-end}
  .btn{margin-top:22px;background:#2563eb;color:#fff;border:0;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer}
  .done{background:#ecfdf5;color:#065f46;border-radius:8px;padding:14px;margin-top:18px}
</style>
</head>
<body>
<div class="top">E-signature (demo)</div>
<main><div class="doc" id="doc"></div></main>
<script>
  const KEY = "tw-portal-demo-v1", id = new URLSearchParams(location.search).get("id");
  let S = null; try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  const me = "sameer@greenleafbakery.com", l = S && S.letters.find(x => x.id === id), doc = document.getElementById("doc");
  if (!l) doc.innerHTML = "<h1>Document not found</h1><p>Open it again from the client portal.</p>";
  else {
    const s = l.signers.find(x => x.email === me), signed = s && s.status === "FINALIZED";
    doc.innerHTML = `<h1>${l.title}</h1><p>This is a demo of the signing page. In the real portal, "Sign now" opens the document in the e-signature service.</p>
      <p>By signing, you agree to the terms of this engagement with Northwind Advisory Group.</p>
      <div class="sig" id="sig">${signed ? "Sameer Khan" : ""}</div>
      ${signed ? `<div class="done">Already signed. You can close this tab.</div>` : `<button class="btn" id="go">Sign as Sameer Khan</button>`}`;
    const go = document.getElementById("go");
    if (go) go.onclick = () => {
      s.status = "FINALIZED";
      if (l.signers.every(x => x.status === "FINALIZED")) { l.state = "closed"; l.closed = "Signed"; }
      S.activity.unshift({ when: new Date().toISOString().slice(0, 16).replace("T", " "), action: "letter_signed", who: me, detail: l.title });
      localStorage.setItem(KEY, JSON.stringify(S));
      document.getElementById("sig").textContent = "Sameer Khan";
      go.outerHTML = `<div class="done">Signed. The "Signature Needed" bulb on the portal clears within 10 seconds. You can close this tab.</div>`;
    };
  }
</script>
</body>
</html>
